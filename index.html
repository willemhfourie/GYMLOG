<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gym log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#f2f2f2;--line:#dcdcdc;--text:#000000;--muted:#686868;
  --green:#12a150;--green-ink:#ffffff;--purple:#7436ec;--purple-soft:rgba(116,54,236,.10);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#161616;--line:#2c2c2c;--text:#ffffff;--muted:#8f8f8f;
    --green:#3fe081;--green-ink:#000000;--purple:#ab8cff;--purple-soft:rgba(171,140,255,.15);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#161616;--line:#2c2c2c;--text:#ffffff;--muted:#8f8f8f;
  --green:#3fe081;--green-ink:#000000;--purple:#ab8cff;--purple-soft:rgba(171,140,255,.15);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px 18px 150px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px}
.linkbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:500;color:var(--text)}
.linkbtn[aria-pressed="true"]{border-color:var(--purple);color:var(--purple);background:var(--purple-soft)}
.tabs{display:flex;gap:clamp(14px,4vw,24px);margin:10px 0 6px}
.tab{background:none;border:0;padding:0 0 6px;font:800 clamp(46px,14vw,68px)/.95 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted);letter-spacing:-.01em;position:relative}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--purple);border-radius:2px}
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:15px;margin-top:8px}
.meta b{color:var(--text);font-weight:600}
.progress{height:4px;background:var(--line);border-radius:2px;margin:10px 0 4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .25s ease}

/* exercises */
.list{margin-top:8px}
.ex{padding:20px 0 18px;border-bottom:1px solid var(--line)}
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ex h3{margin:0;font:600 19px/1.2 Barlow,sans-serif;display:flex;align-items:center;gap:8px}
.ex.done h3{color:var(--green)}
.check{width:18px;height:18px;flex:none}
.spark{flex:none;color:var(--purple)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--purple);color:var(--purple);background:var(--purple-soft);font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
.load{background:none;border:0;padding:2px 0;text-align:left;display:flex;align-items:baseline;gap:6px;border-radius:6px}
.load .n{font:800 46px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.load .u{font-size:15px;color:var(--muted)}
.load .x{font:600 26px/1 "Barlow Condensed",sans-serif;color:var(--muted);margin:0 4px}
.load .pen{width:15px;height:15px;color:var(--purple);align-self:center;margin-left:4px}
.sets{display:flex;gap:8px}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;font:700 18px/1 "Barlow Condensed",sans-serif;color:var(--muted);transition:background .15s,border-color .15s}
.set.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.last{margin:10px 0 0;font-size:14px;color:var(--muted)}
.up{color:var(--green);font-weight:600}
.down{color:var(--purple);font-weight:600}
.note{margin:6px 0 0;font-size:14px;color:var(--muted);font-style:italic}
.add{margin:22px 0 0;width:100%;padding:14px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--muted);font-weight:500}

/* history */
.hist{margin-top:14px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
details.s{border-bottom:1px solid var(--line);padding:14px 0}
details.s summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;cursor:pointer}
details.s summary::-webkit-details-marker{display:none}
.s-day{font:700 26px/1 "Barlow Condensed",sans-serif}
.s-date{color:var(--muted);font-size:14px}
.s-items{margin:12px 0 4px;padding:0;list-style:none}
.s-items li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:15px}
.s-items .v{font-variant-numeric:tabular-nums;color:var(--muted)}
.del{background:none;border:0;color:var(--purple);font-size:14px;padding:8px 0}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.dock-in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.timer{display:flex;align-items:center;gap:8px;min-height:48px}
.timer button{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px}
.timer .restsel{color:var(--muted)}
.tleft{font:800 34px/1 "Barlow Condensed",sans-serif;color:var(--purple);font-variant-numeric:tabular-nums;min-width:62px}
.go{color:var(--green)}
.finish{border:0;border-radius:999px;background:var(--green);color:var(--green-ink);font-weight:600;padding:14px 22px;font-size:16px;white-space:nowrap}
.finish.idle{background:var(--surface);color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 4px;font:800 32px/1 "Barlow Condensed",sans-serif}
.field{margin-top:18px}
.field > label,.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.text{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit}
textarea.text{min-height:64px;resize:vertical}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:700 26px/1 "Barlow Condensed",sans-serif}
.stepper input{height:56px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:800 34px/1 "Barlow Condensed",sans-serif;width:100%;font-variant-numeric:tabular-nums}
.stepper input:disabled{color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--purple)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px}
.danger{color:var(--purple);border-color:var(--purple)}
.primary{margin-top:22px;width:100%;border:0;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;padding:16px;font-size:16px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.topbtns{display:flex;gap:8px}
.sbtns{display:flex;gap:20px}
.sitem{padding:14px 0;border-bottom:1px solid var(--line)}
.sname{font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-top:8px}
.sfield{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.sfield input{text-align:center;font:700 22px/1 "Barlow Condensed",sans-serif;padding:10px 4px}
.row{flex-direction:row;flex-wrap:wrap;align-items:flex-start;column-gap:24px;row-gap:14px}
.row .load{padding:0}
.row .sets{justify-content:flex-start;gap:12px;margin-top:7px}
@supports (text-box: trim-both cap alphabetic){.row .load .n{text-box:trim-both cap alphabetic}.row .sets{margin-top:0}}
.sets .set{width:60px;height:60px;font-size:26px;border-width:2.5px}
.row .sets.many{gap:8px}
.sets.many .set{width:52px;height:52px;font-size:23px}
.setw .setlbl{font-size:12px}
@media (max-width:380px){.sets .set{width:52px;height:52px;font-size:23px}.sets.many .set{width:46px;height:46px;font-size:21px}}
.setw{display:flex;flex-direction:column;align-items:center;gap:4px}
.setlbl{font-size:11px;color:var(--muted);line-height:1}
.tip{margin:10px 0 0;padding:10px 12px;border:1px solid var(--purple);border-radius:12px;font-size:14px;color:var(--text);background:var(--purple-soft)}
.prog .btns{display:flex;gap:6px;flex:none}
.prog .alt{background:none;border:1px solid var(--green);color:var(--green)}
.olist{margin-top:18px}
.olist .v b{margin-left:8px}
.same{color:var(--muted);font-weight:500}
.ttl{display:flex;align-items:center;gap:4px;min-width:0}
.grip{touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;width:30px;height:38px;margin-left:-8px;color:var(--muted);flex:none;border-radius:6px}
.ex{transition:transform .18s ease}
.ex.dragging{transition:none;position:relative;z-index:3;background:var(--bg);box-shadow:0 12px 30px rgba(0,0,0,.35);cursor:grabbing}
.is-dragging{user-select:none;-webkit-user-select:none}
.top{justify-content:flex-end}
.ex-head .hr{display:flex;align-items:center;gap:10px;flex:none}
.exedit{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted)}
.pv{margin-top:18px}
.pnow{margin-top:20px}
.pchart{display:block;width:100%;height:auto;margin-top:14px}
select.text{appearance:auto}
.tab.next::before{content:"";position:absolute;top:2px;right:-10px;width:8px;height:8px;border-radius:50%;background:var(--green)}
.meta b.nextlbl{color:var(--green)}
.set.miss{background:var(--purple);border-color:var(--purple);color:var(--bg)}
.prog{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px 12px;border:1px solid var(--green);border-radius:12px;font-size:14px}
.prog button{border:0;border-radius:999px;background:var(--green);color:var(--green-ink);font-weight:600;padding:8px 14px;white-space:nowrap}
.repgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.rep{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:800 30px/1 "Barlow Condensed",sans-serif}
.rep.low{color:var(--muted)}
.rep.cur{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.bodyv{margin-top:18px}
.bw-now{display:flex;align-items:baseline;gap:6px}
.big{font:800 72px/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.bw-now .u{color:var(--muted)}
.bchart{margin-top:18px}
.bchart svg{display:block;height:150px}
.brange{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.blist{margin-top:22px}
.blist .del{margin-left:10px;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.load .n{font-size:40px}.set{width:40px;height:40px}}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<div class="dock"><div class="dock-in">
  <div class="timer" id="timer"></div>
  <button class="finish" id="finishBtn" data-a="finish">Finish workout</button>
</div></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const uid8=()=>Math.random().toString(36).slice(2,10);
const V=(name,w,r,step)=>({name,w,r,step:step||2});
const E=(sets,variants,o)=>({id:uid8(),sets,variants,active:0,rotate:!!(o&&o.rotate),note:''});
function defaults(){return{v:2,rest:90,day:'push',view:'log',lastDone:{},ticks:{},history:[],body:[],updated:0,days:[
 {id:'push',name:'Push',ex:[
  E(3,[V('Bench press',80,6),V('Soldier press',35,6)],{rotate:true}),
  E(3,[V('Dips',null,9)]),
  E(3,[V('Incline dumbbell press',20,9,2)]),
  E(3,[V('Flyes',18,10,2)]),
  E(3,[V('Side raises',12,10,2)]),
  E(3,[V('Tricep pushdowns',70,9)]),
  E(3,[V('Abs X',null,10),V('Ab machine',50,10)])]},
 {id:'pull',name:'Pull',ex:[
  E(3,[V('Pull-ups',null,5),V('Bent-over row',40,10)]),
  E(3,[V('Hyperextensions',null,10)]),
  E(3,[V('Cable rows',52,10)]),
  E(3,[V('Seated hammer curls',14,8,2)]),
  E(3,[V('Shrugs',24,20,2)]),
  E(3,[V('Preacher curls',25,10),V('Preacher machine',43,10)]),
  E(3,[V('Abs X',null,10),V('Ab machine',50,10)])]},
 {id:'legs',name:'Legs',ex:[
  E(4,[V('Squats',60,6),V('Leg press',80,8)]),
  E(4,[V('Leg extensions',43,10)]),
  E(4,[V('Leg curls',43,10)]),
  E(4,[V('Calf raises',40,20)])]}
]}}
function normalize(s){const d=defaults();if(!s||!Array.isArray(s.days))return d;
 for(const k of ['rest','day','view','lastDone','ticks','history','updated','body'])if(s[k]==null)s[k]=d[k];
 if(!['log','history','body','progress'].includes(s.view))s.view='log';
 if((s.v||1)<2){s.days.forEach(dd=>dd.ex.forEach(ex=>ex.variants.forEach(v=>{if(v.step===2.5)v.step=2})));s.v=2}
 return s}

const LS='gymlog.v1';
function loadLocal(){try{const s=localStorage.getItem(LS);if(s)return JSON.parse(s)}catch(e){}return null}
let state=normalize(loadLocal());
let ref=null,saveT=null,editing=null,picking=null,bodyDraft=null,editingSess=null,sessDraft=null;

function save(){state.updated=Date.now();clearTimeout(saveT);saveT=setTimeout(flush,450)}
async function flush(){const json=JSON.stringify(state);
 try{localStorage.setItem(LS,json)}catch(e){}
 if(ref){try{await ref.set({json,updated:state.updated})}catch(e){}}}
async function connect(){
 if(!(window.claude&&typeof window.claude.use==='function'))return;
 try{
  const [db,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!u)return;const id=await u.id();if(!id)return;
  const r=db.doc('data/users/'+id+'/gym');const snap=await r.get();ref=r;
  if(snap.exists){const d=snap.data();
   if(d&&d.json&&(d.updated||0)>=(state.updated||0)){state=normalize(JSON.parse(d.json));autoDay();render();return}}
  flush();
 }catch(e){ref=null}
}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'BW':String(Math.round(n*100)/100);
const day=()=>state.days.find(d=>d.id===state.day)||state.days[0];
const act=ex=>ex.variants[ex.active]||ex.variants[0];
const findEx=id=>{for(const d of state.days){const e=d.ex.find(x=>x.id===id);if(e)return{d,e}}return null};
function ticks(ex){let t=state.ticks[ex.id];if(!t||t.length!==ex.sets||t.some(x=>typeof x==='boolean')){const o=t||[],r=act(ex).r;t=Array.from({length:ex.sets},(_,i)=>o[i]===true?r:(typeof o[i]==='number'?o[i]:null));state.ticks[ex.id]=t}return t}
const doneN=t=>t.filter(x=>x!=null).length;
const tgt=(v,i)=>(v.rs&&v.rs[i]!=null)?v.rs[i]:v.r;
const restOf=ex=>ex.rest!=null?ex.rest:(/bench|soldier|press|dip|pull|row|squat/i.test(ex.variants.map(x=>x.name).join(' '))?90:60);
function repTxt(ex,v){const a=Array.from({length:ex.sets},(_,i)=>tgt(v,i)),mn=Math.min(...a),mx=Math.max(...a);return mn===mx?String(mn):mn+'–'+mx}
function nextDay(){let best=null,ts=0;for(const k in state.lastDone)if(state.lastDone[k]>ts&&state.days.some(d=>d.id===k)){ts=state.lastDone[k];best=k}
 if(!best)return state.days[0].id;const i=state.days.findIndex(d=>d.id===best);return state.days[(i+1)%state.days.length].id}
function autoDay(){const busy=state.days.some(d=>d.ex.some(ex=>doneN(ticks(ex))>0));if(!busy)state.day=nextDay()}
function canProgress(ex,v,logs){if(v.w==null||v.snoozeW===v.w)return false;const L=logs.slice(0,2);if(L.length<2)return false;
 return L.every(l=>l.w===v.w&&Array.isArray(l.reps)&&l.reps.length>=l.of&&l.reps.every(x=>x>=v.r))}
function progHTML(ex,v){return `<div class="prog"><span>${v.r}+ reps on every set, two sessions running at ${fmt(v.w)} kg.</span><span class="btns"><button class="alt" data-a="snooze" data-id="${ex.id}">Not now</button><button data-a="progress" data-id="${ex.id}">+2 kg</button></span></div>`}
function bodyChart(B){const pts=B.slice(0,60).reverse();if(pts.length<2)return'';
 const W=600,H=150,p=14,vals=pts.map(x=>x.kg),mn=Math.min(...vals),mx=Math.max(...vals),span=(mx-mn)||1;
 const xy=pts.map((x,i)=>[p+i*(W-2*p)/(pts.length-1),H-p-(x.kg-mn)*(H-2*p)/span]);
 return `<div class="bchart"><svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" role="img" aria-label="Body weight trend"><polyline points="${xy.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--purple)" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg><div class="brange"><span>Low ${fmt(mn)} kg</span><span>High ${fmt(mx)} kg</span></div></div>`}
const shortDate=ts=>new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
function progOptions(){const o=[{key:'__all',label:'Overview',group:'Overall'},{key:'__body',label:'Body weight',group:'Overall'}];
 state.days.forEach(d=>d.ex.forEach(ex=>ex.variants.forEach(v=>o.push({key:ex.id+'|'+v.name,label:v.name,group:d.name,ex,v}))));return o}
function progSeries(key,metric){
 if(key==='__body')return{pts:state.body.map(x=>({t:x.date,y:x.kg})).reverse(),unit:'kg'};
 const cut=key.indexOf('|'),id=key.slice(0,cut),name=key.slice(cut+1),pts=[];let bw=false;
 for(const s of state.history)for(const it of s.items)if(it.exId===id&&it.name===name){
  const reps=it.reps||Array(it.sets).fill(it.r),tot=reps.reduce((a,b)=>a+b,0);if(it.w==null)bw=true;

 $('#sheetRoot').innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">
  <h2 id="sh">${esc(v.name)}</h2>
  ${ex.variants.length>1?`<div class="chips">${ex.variants.map((x,i)=>`<button class="chip" data-a="sheetvar" data-i="${i}" aria-pressed="${i===ex.active}">${esc(x.name)}</button>`).join('')}</div>`:''}
  <div class="field"><label for="f-name">Name</label><input id="f-name" class="text" data-f="name" value="${esc(v.name)}"></div>
  <div class="field"><span class="lbl">Weight (kg)</span><div class="stepper"><button data-a="step" data-k="w" data-d="-1" aria-label="Less weight" ${bw?'disabled':''}>−</button><input inputmode="decimal" data-f="w" value="${bw?'':fmt(v.w)}" ${bw?'disabled placeholder="BW"':''} aria-label="Weight"><button data-a="step" data-k="w" data-d="1" aria-label="More weight" ${bw?'disabled':''}>+</button></div>
   <label class="toggle"><input type="checkbox" data-f="bw" ${bw?'checked':''}> Bodyweight</label></div>
  <div class="field two">
   <div><span class="lbl">Reps, all sets</span><div class="stepper"><button data-a="step" data-k="r" data-d="-1" aria-label="Fewer reps">−</button><input inputmode="numeric" data-f="r" value="${Math.max(...Array.from({length:ex.sets},(_,i)=>tgt(v,i)))}" aria-label="Reps"><button data-a="step" data-k="r" data-d="1" aria-label="More reps">+</button></div></div>
   <div><span class="lbl">Sets</span><div class="stepper"><button data-a="step" data-k="sets" data-d="-1" aria-label="Fewer sets">−</button><input inputmode="numeric" data-f="sets" value="${ex.sets}" aria-label="Sets"><button data-a="step" data-k="sets" data-d="1" aria-label="More sets">+</button></div></div>
  </div>
  <p class="hint">Each set remembers the reps you last logged. Changing reps here resets every set to the same number.</p>
  <div class="field"><span class="lbl">Weight jump per tap</span><div class="seg">${steps.map(s=>`<button class="chip" data-a="setstep" data-s="${s}" aria-pressed="${v.step===s}">${s} kg</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">Rest after each set</span><div class="seg">${[45,60,90,120,180].map(s=>`<button class="chip" data-a="setrest" data-s="${s}" aria-pressed="${restOf(ex)===s}">${s<60?s+' s':(s/60)+' min'}</button>`).join('')}</div></div>
  <div class="field"><label for="f-note">Notes</label><textarea id="f-note" class="text" data-f="note" placeholder="Seat height, grip, cues">${esc(ex.note)}</textarea></div>
  ${ex.variants.length>1?`<label class="toggle"><input type="checkbox" data-f="rotate" ${ex.rotate?'checked':''}> Switch to the alternative automatically each workout</label>`:''}
  <div class="actions">
   <button class="ghost" data-a="addvar">Add alternative</button>
   ${ex.variants.length>1?'<button class="ghost" data-a="delvar">Remove this alternative</button>':''}
   <button class="ghost" data-a="move" data-d="-1" ${idx===0?'disabled':''}>Move up</button>
   <button class="ghost" data-a="move" data-d="1" ${idx===f.d.ex.length-1?'disabled':''}>Move down</button>
   <button class="ghost danger" data-a="delex">Remove exercise</button>
  </div>
  <button class="primary" data-a="close">Done</button>
 </div></div>`}

document.addEventListener('input',e=>{if(sessDraft&&e.target.dataset&&e.target.dataset.s){const it=sessDraft.items[+e.target.dataset.k],val=e.target.value.trim();
  if(e.target.dataset.s==='w'){if(val==='')it.w=null;else{const n=parseFloat(val.replace(',','.'));if(!isNaN(n)&&n>=0)it.w=n}}
  else{const n=parseInt(val);if(!isNaN(n)&&n>=0)it.reps[+e.target.dataset.j]=n}return}
 if(e.target.id==='bw-in'){const n=parseFloat(e.target.value.replace(',','.'));if(!isNaN(n))bodyDraft=n;return}
 const k=e.target.dataset&&e.target.dataset.f;if(!k||!editing)return;
 const ex=findEx(editing).e,v=act(ex),val=e.target.value;
 if(k==='name'){v.name=val;$('#sh').textContent=val||'Untitled'}
 else if(k==='w'){const n=parseFloat(val.replace(',','.'));if(!isNaN(n))v.w=n}
 else if(k==='r'){const n=parseInt(val);if(!isNaN(n)&&n>0){v.r=n;v.rs=null}}
 else if(k==='sets'){const n=parseInt(val);if(!isNaN(n)&&n>0&&n<=10)ex.sets=n}
 else if(k==='note')ex.note=val;
 save()});
document.addEventListener('change',e=>{if(e.target.id==='p-key'){state.prog.key=e.target.value;save();render();return}
 const k=e.target.dataset&&e.target.dataset.f;if(!k||!editing)return;
 const ex=findEx(editing).e,v=act(ex);
 if(k==='bw'){if(e.target.checked){if(v.w!=null)v.lastW=v.w;v.w=null}else v.w=v.lastW||20;renderSheet()}
 if(k==='rotate')ex.rotate=e.target.checked;save()});

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='scrim'){if(e.target===b)closeEditor();return}
 if(a==='day'){state.day=b.dataset.day;state.view='log';save();render();return}
 if(a==='history'){state.view=state.view==='history'?'log':'history';save();render();return}
 if(a==='tick'){const ex=findEx(b.dataset.id).e,t=ticks(ex),i=+b.dataset.i;if(t[i]==null){t[i]=tgt(act(ex),i);startTimer(restOf(ex));save();render()}else{picking={id:ex.id,i};renderPicker()}return}
 if(a==='editsession'){const s=state.history.find(x=>x.id===b.dataset.id);if(!s)return;sessDraft=JSON.parse(JSON.stringify(s));sessDraft.items.forEach(it=>{if(!Array.isArray(it.reps))it.reps=Array(it.sets).fill(it.r)});editingSess=s.id;renderSessSheet();return}
 if(a==='sdelitem'&&sessDraft){sessDraft.items.splice(+b.dataset.k,1);renderSessSheet();return}
 if(a==='ssave'&&sessDraft){if(!sessDraft.items.length){toast('Nothing left. Use Delete this session instead.');return}
  sessDraft.items.forEach(it=>{it.sets=it.reps.length});const i=state.history.findIndex(x=>x.id===editingSess);if(i>=0)state.history[i]=sessDraft;closeEditor();toast('Session updated');return}
 if(a==='pickrep'&&picking){ticks(findEx(picking.id).e)[picking.i]=+b.dataset.n;state.tipReps=true;closeEditor();return}
 if(a==='rstep'&&picking){const inp=$('#rep-in');const n=Math.max(0,(parseInt(inp.value)||0)+(+b.dataset.d));inp.value=n;return}
 if(a==='saverep'&&picking){const n=parseInt($('#rep-in').value);if(isNaN(n)||n<0){toast('Enter a number of reps');return}ticks(findEx(picking.id).e)[picking.i]=n;state.tipReps=true;closeEditor();return}
 if(a==='untick'&&picking){ticks(findEx(picking.id).e)[picking.i]=null;closeEditor();return}
 if(a==='progress'){const ex=findEx(b.dataset.id).e,v=act(ex);if(v.w==null)return;v.w=Math.round((v.w+2)*100)/100;v.rs=null;save();render();toast(`${v.name} now ${fmt(v.w)} kg, sets reset to ${v.r} reps`);return}
 if(a==='snooze'){const v=act(findEx(b.dataset.id).e);v.snoozeW=v.w;save();render();return}
 if(a==='pview'){state.view=state.view==='progress'?'log':'progress';save();render();window.scrollTo({top:0});return}
 if(a==='prange'){state.prog.range=b.dataset.r;save();render();return}
 if(a==='pmetric'){state.prog.metric=b.dataset.m;save();render();return}
 if(a==='body'){state.view=state.view==='body'?'log':'body';bodyDraft=null;save();render();return}
 if(a==='bstep'){const cur=bodyDraft!=null?bodyDraft:(state.body[0]?state.body[0].kg:75);bodyDraft=Math.round((cur+(+b.dataset.d)*0.1)*10)/10;const inp=$('#bw-in');if(inp)inp.value=fmt(bodyDraft);return}
 if(a==='logbody'){const kg=bodyDraft!=null?bodyDraft:(state.body[0]?state.body[0].kg:null);if(kg==null||!(kg>0)){toast('Enter your weight first');return}
  const td=new Date().toDateString();state.body=state.body.filter(x=>new Date(x.date).toDateString()!==td);state.body.unshift({id:uid8(),date:Date.now(),kg});state.body.sort((p,q)=>q.date-p.date);bodyDraft=null;save();render();toast(`${fmt(kg)} kg logged`);return}
 if(a==='delbody'){if(confirm('Delete this entry?')){state.body=state.body.filter(x=>x.id!==b.dataset.id);save();render()}return}
 if(a==='variant'){const ex=findEx(b.dataset.id).e;ex.active=+b.dataset.i;save();render();return}
 if(a==='edit'){openEditor(b.dataset.id);return}
 if(a==='add'){const ex=E(3,[V('New exercise',20,10)]);day().ex.push(ex);save();render();openEditor(ex.id);setTimeout(()=>{const n=$('#f-name');n&&n.select()},50);return}
 if(a==='finish'){finish();return}
 if(a==='restcycle'){const o=[60,90,120,180];state.rest=o[(o.indexOf(state.rest)+1)%o.length];goFlash=false;save();renderTimer();return}
 if(a==='add15'){tEnd+=15000;renderTimer();return}
 if(a==='skip'){stopTimer();return}
 if(a==='delsession'){if(confirm('Delete this session from history?')){state.history=state.history.filter(s=>s.id!==b.dataset.id);save();render()}return}
 if(!editing)return;
 const f=findEx(editing),ex=f.e,v=act(ex);
 if(a==='close'){closeEditor();return}
 if(a==='step'){const k=b.dataset.k,d=+b.dataset.d;
  if(k==='w'&&v.w!=null)v.w=Math.max(0,Math.round((v.w+d*v.step)*100)/100);
  if(k==='r'){const r0=$('[data-f="r"]');v.r=Math.max(1,(parseInt(r0&&r0.value)||v.r)+d);v.rs=null}
  if(k==='sets')ex.sets=Math.min(10,Math.max(1,ex.sets+d));
  const inp=$(`[data-f="${k}"]`);if(inp)inp.value=k==='w'?fmt(v.w):k==='r'?v.r:ex.sets;save();return}
 if(a==='setrest'){ex.rest=+b.dataset.s;save();renderSheet();return}
 if(a==='setstep'){v.step=+b.dataset.s;save();renderSheet();return}
 if(a==='sheetvar'){ex.active=+b.dataset.i;save();renderSheet();return}
 if(a==='addvar'){ex.variants.push(V('Alternative',v.w,v.r,v.step));ex.active=ex.variants.length-1;save();renderSheet();setTimeout(()=>{const n=$('#f-name');n&&n.select()},50);return}
 if(a==='delvar'){ex.variants.splice(ex.active,1);ex.active=0;if(ex.variants.length<2)ex.rotate=false;save();renderSheet();return}
 if(a==='move'){const arr=f.d.ex,i=arr.indexOf(ex),j=i+(+b.dataset.d);if(j<0||j>=arr.length)return;arr.splice(i,1);arr.splice(j,0,ex);save();renderSheet();return}
 if(a==='delex'){if(confirm(`Remove ${v.name} from this day? Its past sessions stay in History.`)){f.d.ex.splice(f.d.ex.indexOf(ex),1);delete state.ticks[ex.id];closeEditor()}return}
});
let drag=null,dragRAF=0;
function dragMove(){if(!drag)return;const d=drag,dy=(d.cy+scrollY)-(d.y0+d.sy0);
 d.art.style.transform=`translateY(${dy}px)`;
 const c=d.tops[d.from]+d.hs[d.from]/2+dy;let to=d.from;
 for(let i=0;i<d.items.length;i++){if(i<d.from&&c<d.tops[i]+d.hs[i]/2){to=i;break}}
 if(to===d.from)for(let i=d.items.length-1;i>d.from;i--){if(c>d.tops[i]+d.hs[i]/2){to=i;break}}
 d.to=to;const h=d.hs[d.from];
 d.items.forEach((el,i)=>{if(el===d.art)return;let s=0;if(d.from<to&&i>d.from&&i<=to)s=-h;else if(to<d.from&&i>=to&&i<d.from)s=h;el.style.transform=s?`translateY(${s}px)`:''})}
function dragLoop(){if(!drag)return;const y=drag.cy,edge=90,bottom=innerHeight-150;
 if(y<edge)scrollBy(0,-Math.ceil((edge-y)/6));else if(y>bottom)scrollBy(0,Math.ceil((y-bottom)/6));
 dragMove();dragRAF=requestAnimationFrame(dragLoop)}
document.addEventListener('pointerdown',e=>{const g=e.target.closest&&e.target.closest('.grip');if(!g||drag)return;e.preventDefault();
 const art=g.closest('.ex'),items=[...art.parentElement.children],rs=items.map(el=>el.getBoundingClientRect());
 drag={art,items,tops:rs.map(r=>r.top+scrollY),hs:rs.map(r=>r.height),from:items.indexOf(art),to:items.indexOf(art),y0:e.clientY,cy:e.clientY,sy0:scrollY};
 try{g.setPointerCapture(e.pointerId)}catch(_){}
 art.classList.add('dragging');document.body.classList.add('is-dragging');try{navigator.vibrate&&navigator.vibrate(10)}catch(_){}
 dragRAF=requestAnimationFrame(dragLoop)});
document.addEventListener('pointermove',e=>{if(drag)drag.cy=e.clientY});
function dragEnd(){if(!drag)return;cancelAnimationFrame(dragRAF);const from=drag.from,to=drag.to;
 drag.items.forEach(el=>el.style.transform='');drag.art.classList.remove('dragging');document.body.classList.remove('is-dragging');drag=null;
 if(from!==to){const arr=day().ex,[m]=arr.splice(from,1);arr.splice(to,0,m);save()}render()}
document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd);
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('.grip');if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;e.preventDefault();
 const id=g.closest('.ex').dataset.id,arr=day().ex,i=arr.findIndex(x=>x.id===id),j=i+(e.key==='ArrowUp'?-1:1);if(j<0||j>=arr.length)return;
 const [m]=arr.splice(i,1);arr.splice(j,0,m);save();render();const ng=document.querySelector(`.ex[data-id="${id}"] .grip`);ng&&ng.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(editing||picking||sessDraft))closeEditor()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();else if(state.days.some(d=>d.ex.some(ex=>doneN(ticks(ex))>0)))keepAwake(true)});

autoDay();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
})();
</script>
</body>
</html>
